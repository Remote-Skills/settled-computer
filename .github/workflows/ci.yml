name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  selftest:
    # The engine self-test is pure numpy + a synthetic screen: runs anywhere, no display.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install numpy
      - run: python settled_computer/engine.py --selftest

  linux-xvfb-e2e:
    # Full server end-to-end on a virtual display: import, tool listing, allowlist,
    # and the MCP stdio round trip (screen_info). Real input injection stays manual.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb scrot
      - run: pip install -e ".[desktop,fast,unicode]" pytest
      - name: Selftest under Xvfb
        run: xvfb-run -a python settled_computer/engine.py --selftest
      - name: Server imports, registers tools, allowlist gates
        run: |
          xvfb-run -a python - <<'EOF'
          import os, asyncio
          os.environ["SETTLE_MCP_TOOLS"] = "screenshot,screen_info,wait"
          import settled_computer.server as srv
          tools = asyncio.run(srv.mcp.list_tools())
          assert len(tools) == 11, tools
          async def t():
              try:
                  await srv.click(x=10, y=10)
                  raise AssertionError("click should have been blocked")
              except Exception as e:
                  assert "allowlist" in str(e), e
              await srv.screen_info()
          asyncio.run(t())
          print("linux xvfb e2e OK")
          EOF

  docker-boot:
    # Glama-style registry check: build the image, boot the server under Xvfb,
    # verify it answers MCP initialize + tools/list over stdio.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t settled-computer .
      - name: Boot server, verify MCP introspection
        run: |
          docker run -d --name sc settled-computer
          sleep 5
          python3 - <<'EOF'
          import json, subprocess

          p = subprocess.Popen(
              ["docker", "exec", "-i", "sc", "settled-computer"],
              stdin=subprocess.PIPE, stdout=subprocess.PIPE)

          def send(msg):
              p.stdin.write((json.dumps(msg) + "\n").encode())
              p.stdin.flush()

          send({"jsonrpc": "2.0", "id": 1, "method": "initialize",
                "params": {"protocolVersion": "2024-11-05", "capabilities": {},
                           "clientInfo": {"name": "ci", "version": "0"}}})
          line = p.stdout.readline()
          assert b"serverInfo" in line, f"no initialize response: {line[:300]}"

          send({"jsonrpc": "2.0", "method": "notifications/initialized"})
          send({"jsonrpc": "2.0", "id": 2, "method": "tools/list"})
          tools_line = None
          for _ in range(5):  # skip any interleaved notifications
              line = p.stdout.readline()
              if b'"tools"' in line:
                  tools_line = line
                  break
          assert tools_line, "no tools/list response"
          names = [t.get("name") for t in json.loads(tools_line)["result"]["tools"]]
          print(f"containerized server OK: {len(names)} tools: {names}")
          assert len(names) == 11
          EOF
          docker rm -f sc >/dev/null

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
